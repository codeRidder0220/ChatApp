services:
  postgres:
    image: postgres:17
    container_name: chatApp
    restart: always
    environment:
      POSTGRES_USER: chat_user
      POSTGRES_PASSWORD: chat_password
      POSTGRES_DB: chat_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data



  redis:
    image: redis:7
    container_name: chat_redis
    restart: always
    ports:
      - "6379:6379"


      
volumes:
  postgres_data:
